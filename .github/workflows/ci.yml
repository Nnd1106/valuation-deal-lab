name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Engine against closed forms and accounting identities, then the
      # browser engine against the numbers the Python engine published.
      - name: Engine tests
        run: python -m pytest tests -q

      - name: Python / browser engine parity
        run: node tests/parity.js
